<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="calculator-card">
            <div class="header">
                <h1>BMI Calculator</h1>
                <p>Check your Body Mass Index</p>
            </div>

            <form id="bmiForm">
                <div class="input-group">
                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" placeholder="e.g., 175" step="0.1" required>
                    <span class="error-message" id="heightError"></span>
                </div>

                <div class="input-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" placeholder="e.g., 70" step="0.1" required>
                    <span class="error-message" id="weightError"></span>
                </div>

                <button type="submit" class="submit-btn">Calculate BMI</button>
            </form>

            <div class="result-container hidden" id="resultContainer">
                <div class="bmi-score-wrapper">
                    <div class="bmi-score" id="bmiScore">0.0</div>
                    <div class="bmi-label">Your BMI</div>
                </div>
                <div class="category" id="bmiCategory">Category</div>
                <div class="message" id="bmiMessage">Message</div>
                <div class="range-indicator">
                    <div class="range-bar">
                        <div class="marker" id="rangeMarker"></div>
                    </div>
                    <div class="range-labels">
                        <span>Underweight</span>
                        <span>Normal</span>
                        <span>Overweight</span>
                        <span>Obese</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
